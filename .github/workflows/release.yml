name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: videodown
  CGO_ENABLED: '0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            target: linux
            archive: videodown-linux-amd64.tar.gz
          - name: windows-amd64
            os: windows-latest
            target: windows
            archive: videodown-windows-amd64.zip
          - name: macos-universal
            os: macos-latest
            target: darwin
            archive: videodown-macos-universal.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Test and check native UI
        shell: bash
        run: |
          go test ./...
          go tool mygo vet .

      - name: Build native app and updater
        shell: bash
        run: |
          mkdir -p build/bin
          version="${{ github.ref_name }}"
          target="${{ matrix.target }}"
          if [ "$target" = darwin ]; then
            for arch in amd64 arm64; do
              go run ./cmd/package -os darwin -arch "$arch" -version "$version" -out "build/$arch"
            done
            lipo -create build/amd64/videodown build/arm64/videodown -output build/bin/videodown
            lipo -create build/amd64/videodown-updater build/arm64/videodown-updater -output build/bin/videodown-updater
          else
            go run ./cmd/package -os "$target" -arch amd64 -version "$version" -out build/bin
          fi

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          package_dir="dist/package/videodown"
          mkdir -p "$package_dir"
          cp build/bin/videodown build/bin/videodown-updater "$package_dir/"
          chmod +x "$package_dir/videodown" "$package_dir/videodown-updater"
          tar -czf "dist/${{ matrix.archive }}" -C dist/package videodown

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PackageDir = "dist/package/videodown"
          New-Item -ItemType Directory -Force -Path "$PackageDir" | Out-Null
          Copy-Item build/bin/videodown.exe, build/bin/videodown-updater.exe -Destination "$PackageDir/"
          Compress-Archive -Path "$PackageDir" -DestinationPath "dist/${{ matrix.archive }}" -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          notes_file="release-notes.md"
          awk -v tag="$tag" '
            $0 == "## " tag { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$notes_file"
          if [ ! -s "$notes_file" ]; then
            echo "No changelog entry found for $tag." > "$notes_file"
          fi

          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file "$notes_file"
          fi
          gh release upload "${{ github.ref_name }}" dist/* --clobber
