name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: videodown
  WAILS_VERSION: v3.0.0-beta.13
  NODE_OPTIONS: --max-old-space-size=4096
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            platform: linux/amd64
            archive: videodown-linux-amd64.tar.gz
            build_tags: webkit2_41
          - name: windows-amd64
            os: windows-latest
            platform: windows/amd64
            archive: videodown-windows-amd64.zip
            build_tags: ""
          - name: macos-universal
            os: macos-latest
            platform: darwin/universal
            archive: videodown-macos-universal.tar.gz
            build_tags: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.0"
          token: ${{ github.token }}
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          check-latest: false
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev xvfb

      - name: Add Go bin to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Build Wails app
        shell: bash
        env:
          mode: prod
        run: |
          LDFLAGS="-X github.com/kamiertop/videodown/internal/updater.Version=${{ github.ref_name }} -X github.com/kamiertop/videodown/logger.Mode=prod"
          target_os="${{ matrix.platform }}"
          target_arch="${target_os#*/}"
          target_os="${target_os%%/*}"
          if [ "$target_arch" = "universal" ]; then
            target_arch="arm64"
          fi
          output="build/bin/${{ env.APP_NAME }}"
          if [ "$target_os" = "windows" ]; then
            output="$output.exe"
          fi
          cd frontend && npm ci && npm run build && cd ..
          GOOS="$target_os" GOARCH="$target_arch" go build -buildvcs=false -ldflags "$LDFLAGS" -o "$output"
          updater_output="build/bin/${{ env.APP_NAME }}-updater"
          if [ "$target_os" = "windows" ]; then
            updater_output="$updater_output.exe"
          fi
          GOOS="$target_os" GOARCH="$target_arch" go build -buildvcs=false -o "$updater_output" ./cmd/updater
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run --auto-servernum true
          else
            true
          fi

      - name: Package Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package_dir="dist/package/${{ env.APP_NAME }}"
          mkdir -p "$package_dir"
          cp "build/bin/${{ env.APP_NAME }}" "$package_dir/"
          cp "build/bin/${{ env.APP_NAME }}-updater" "$package_dir/"
          cp "build/appicon.png" "$package_dir/"
          tar -czf "dist/${{ matrix.archive }}" -C "dist/package" "${{ env.APP_NAME }}"

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PackageDir = "dist/package/${{ env.APP_NAME }}"
          New-Item -ItemType Directory -Force -Path "$PackageDir" | Out-Null
          Copy-Item "build/bin/${{ env.APP_NAME }}.exe" "$PackageDir/"
          Copy-Item "build/bin/${{ env.APP_NAME }}-updater.exe" "$PackageDir/"
          Compress-Archive -Path "$PackageDir" -DestinationPath "dist/${{ matrix.archive }}" -Force

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          package_dir="dist/package/${{ env.APP_NAME }}"
          mkdir -p "$package_dir"
          cp "build/bin/${{ env.APP_NAME }}" "$package_dir/"
          cp "build/bin/${{ env.APP_NAME }}-updater" "$package_dir/"
          chmod +x "$package_dir/${{ env.APP_NAME }}"
          tar -czf "dist/${{ matrix.archive }}" -C "dist/package" "${{ env.APP_NAME }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          notes_file="release-notes.md"
          awk -v tag="$tag" '
            $0 == "## " tag { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$notes_file"
          if [ ! -s "$notes_file" ]; then
            echo "No changelog entry found for $tag." > "$notes_file"
          fi

          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file "$notes_file"
          fi
          gh release upload "${{ github.ref_name }}" dist/* --clobber
