# Wails v3 project configuration.
version: '3'

info:
  companyName: "kamiertop"
  productName: "VideoDown"
  productIdentifier: "com.kamiertop.videodown"
  description: "Bilibili and Douyin video downloader"
  copyright: "(c) 2026 kamiertop"
  comments: "VideoDown"
  version: "0.17.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 100
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      - tests
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task build
      type: blocking
    - cmd: wails3 task run
      type: primary
