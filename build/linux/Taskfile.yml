version: '3'

tasks:
  build:
    env:
      GOCACHE: /tmp/videodown-go-cache
    cmds:
      - wails3 task common:build:frontend
      - go build -buildvcs=false -ldflags="-X github.com/kamiertop/videodown/internal/updater.Version={{.APP_VERSION}}" -o "{{.BIN_DIR}}/{{.APP_NAME}}"
      - go build -buildvcs=false -o "{{.BIN_DIR}}/{{.APP_NAME}}-updater" ./cmd/updater

  package:
    deps: [build]

  run:
    cmds:
      - "{{.BIN_DIR}}/{{.APP_NAME}}"
